# Nome do aplicativo
spring.application.name=linkwork

# Caminho da conexão (o banco é criado automaticamente se não existir)
spring.datasource.url=jdbc:mysql://localhost:3306/linkwork?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo

# Usuário e senha do MySQL (ajuste para o seu ambiente)
spring.datasource.username=root
spring.datasource.password=root

# Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Recria as tabelas a cada execução e carrega o import.sql (dados de teste)
spring.jpa.hibernate.ddl-auto=create

# Exibe as SQLs
spring.jpa.show-sql=true

# Formata as SQLs
spring.jpa.properties.hibernate.format_sql=true

# Especifica o dialeto
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# As validações são feitas na entrada da API (@Valid nos controllers);
# desativa a revalidação automática do Hibernate ao salvar as entidades
spring.jpa.properties.jakarta.persistence.validation.mode=none

# Lê o import.sql em UTF-8 (acentuação correta)
spring.jpa.properties.hibernate.hbm2ddl.charset_name=UTF-8

# Evita consultas abertas durante a serialização JSON
spring.jpa.open-in-view=false

# Datas no formato ISO (2026-12-31T10:00:00)
spring.jackson.serialization.write-dates-as-timestamps=false
